name: public-source-quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install settings UI dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm --dir settings-ui install --frozen-lockfile --ignore-scripts
      - name: Check public boundary
        shell: pwsh
        run: |
          foreach ($path in @('private-pets', 'private-assets')) {
            if (Test-Path -LiteralPath $path) { throw "Private source in public snapshot: $path" }
          }
      - name: Required checks
        shell: pwsh
        run: ./scripts/check.ps1
