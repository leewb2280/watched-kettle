[project]
name = "watched-kettle"
dynamic = ["version"]
requires-python = ">=3.14,<3.15"

[tool.setuptools.dynamic]
version = {attr = "watched_kettle.branding.APPLICATION_VERSION"}

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = [
    ".codex",
    "build",
    "dist",
    "dev-artifacts",
    "pet-workspaces",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "B"]
# zip(strict=True) raises where unequal lengths are fine today; not a style fix.
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"scripts/validate_project.py" = ["E402"]
# Tests and tools define small closures used within the same loop iteration
# and fixed default arguments on purpose.
"tests/**" = ["B007", "B008", "B023"]
"scripts/**" = ["B007", "B008", "B023"]

[tool.mypy]
python_version = "3.14"
# Required in scripts/check.ps1: the whole package and the two generators
# the settings protocol and runtime checks rely on.
files = [
    "watched_kettle",
    "scripts/runtime_check.py",
    "scripts/generate_settings_protocol.py",
]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true

[tool.coverage.run]
branch = true
source = ["watched_kettle"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
